name: build-ko

# 云端编两样东西，本机不装任何软件：
#   1) mhxy_drv.ko   内核模块（x86_64）
#   2) kread         静态 Android x86_64 客户端（设备上没有 python，必须给二进制）
# 触发：Actions 页面 "Run workflow"，或 push 到 drv/**
on:
  workflow_dispatch:
  push:
    paths:
      - 'drv/**'
      - '.github/workflows/build-ko.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc flex bison libelf-dev libssl-dev xz-utils wget unzip

      - name: 内核源码 + modules_prepare
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.90.tar.xz
          tar xf linux-6.1.90.tar.xz
          cd linux-6.1.90
          make ARCH=x86_64 defconfig >/dev/null
          make ARCH=x86_64 modules_prepare >/dev/null
          echo "KDIR=$PWD" >> "$GITHUB_ENV"

      - name: 编内核模块
        run: |
          cd drv
          # KBUILD_MODPOST_WARN=1：无 Module.symvers 时把 "no symbol version" 降级为警告
          make -j"$(nproc)" KDIR="$KDIR" ARCH=x86_64 KBUILD_MODPOST_WARN=1

      - name: 编静态客户端（NDK r27c）
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          CC="$PWD/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          "$CC" -static -O2 -s -o "$GITHUB_WORKSPACE/drv/kread" "$GITHUB_WORKSPACE/drv/kread.c"
          file "$GITHUB_WORKSPACE/drv/kread"

      - name: 产物检查
        run: |
          ls -l drv/mhxy_drv.ko drv/kread
          file drv/mhxy_drv.ko
          modinfo drv/mhxy_drv.ko || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhxy_drv-ko
          path: |
            drv/mhxy_drv.ko
            drv/kread
          if-no-files-found: error
